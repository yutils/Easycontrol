plugins {
    id 'com.android.application'
}

android {
    namespace 'top.saymzx.easycontrol.app'
    compileSdk 35
    defaultConfig {
        applicationId "top.saymzx.easycontrol.app"
        minSdk 23
        targetSdk 34
        versionCode 10601
        versionName "1.6.1"
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
        }
    }
    viewBinding {
        enabled = true
    }
    signingConfigs {
        debug {
            storeFile file("doc/yujingtest.jks")
            storePassword "123456"
            keyAlias "test"
            keyPassword "123456"
        }
        release {
            storeFile file("doc/yujingtest.jks")
            storePassword "123456"
            keyAlias "test"
            keyPassword "123456"
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug" //包名后缀
            buildConfigField "boolean", "ENABLE_DEBUG_FEATURE", "true"
            manifestPlaceholders = [app_name: "@string/app_name_dev", app_icon: "@mipmap/ic_launcher_dev", app_icon_round: "@mipmap/ic_launcher_dev_round"]
            debuggable true
        }
        release {
            signingConfig signingConfigs.release
            buildConfigField "boolean", "ENABLE_DEBUG_FEATURE", "false"
            manifestPlaceholders = [app_name: "@string/app_name", app_icon: "@mipmap/ic_launcher", app_icon_round: "@mipmap/ic_launcher_round"]
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources.excludes.add("META-INF/*")
    }

    buildFeatures {
        buildConfig = true
    }
}
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { output ->
            output.outputFileName.set("Yikong•Yuji_v${output.versionName.get()}_${variant.buildType}.apk")
        }
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.kotlinx:appUpdate:0.0.5'
}

// 服务端 APK 由 :server:copyRelease 拷入 res/raw/easycontrol_server.jar。
// 让 copyRelease 先于 preBuild 执行：preBuild 是各类资源/编译任务的共同上游，
// 所有消费 res 目录的任务都会晚于 copyRelease，满足 Gradle 9 的显式依赖校验
tasks.named("preBuild").configure {
    dependsOn project(":server").tasks.named("copyRelease")
}
